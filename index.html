<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background: linear-gradient(135deg,#050404,#fad0c4,#fbc2eb,#a6c1ee);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
font-weight:bold;
}

.game-container{
background:rgb(241, 239, 75);
padding:30px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
text-align:center;
}

.choice-btn{
font-size:20px;
padding:15px;
border-radius:8px;
transition:0.3s;
}

.choice-btn:hover{
transform:scale(1.1);
}

.result{
font-size:22px;
font-weight:bold;
}

.score{
font-size:20px;
font-weight:bold;
}

.choice-display{
font-size:18px;
}

</style>

</head>

<body>

<div class="container">
<div class="game-container col-md-6 mx-auto">

<h1 class="text-primary fw-bold mb-3">Rock Paper Scissors</h1>
<p class="text-muted">User vs Computer</p>

<!-- SCOREBOARD -->

<div class="row mb-3">

<div class="col">
<p class="score text-success">
User Score: <span id="userScore">0</span>
</p>
</div>

<div class="col">
<p class="score text-danger">
Computer Score: <span id="computerScore">0</span>
</p>
</div>

</div>

<!-- USER & COMPUTER DISPLAY -->

<p id="userChoice" class="choice-display ">
👤 User: -
</p>

<p id="computerChoice" class="choice-display">
💻 Computer: -
</p>

<hr>

<!-- BUTTONS -->

<div class="d-grid gap-3">
    
 <p id="result" class="result text-primary"></p>

<button class="btn btn-danger choice-btn" onclick="playGame('rock')">
🪨 Rock
</button>

<button class="btn btn-warning choice-btn" onclick="playGame('paper')">
📄 Paper
</button>

<button class="btn btn-success choice-btn" onclick="playGame('scissors')">
✂️ Scissors
</button>

</div>

<hr>


<button class="btn btn-dark w-100 mt-3" onclick="resetGame()">
Reset Game
</button>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
