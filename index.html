<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors Game</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background: linear-gradient(135deg,rgb(62, 207, 98),#fad0c4,#fbc2eb,#3d6cbe);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
font-weight:bold;
}

.game-container{
background:rgb(248, 245, 69);
padding:30px;
border-radius:10px;
box-shadow: 10px 20px rgba(0,0,0,0.2);
text-align:center;
}

.choice-btn{
font-size:20px;
padding:5px;
border-radius:10px;
transition:0.2s;
}

.choice-btn:hover{
transform:scale(1.1);
}

.result{
font-size:18px;
font-weight:bold;
}

.score{
font-size:15px;
font-weight:bold;
}

.choice-display{
font-size:18px;
}

</style>

</head>

<body>

<div class="container">
<div class="game-container col-md-6 mx-auto">

<h1 class="text-dark fw-bold mb-3">Rock Paper Scissors</h1>
<p class="text-primary">User vs Computer</p>

<!-- SCOREBOARD -->

<div class="row mb-3">

<div class="col">
<p class="score text-success">
User Score: <span id="userScore">0</span>
</p>
</div>

<div class="col">
<p class="score text-danger">
Computer Score: <span id="computerScore">0</span>
</p>
</div>

</div>

<!-- USER & COMPUTER DISPLAY -->

<p id="userChoice" class="choice-display ">
👤User: -
</p>

<p id="computerChoice" class="choice-display">
💻 Computer using : -
</p>

<hr>

<!-- BUTTONS -->

<div class="d-grid gap-3">
    
 <p id="result" class="result text-primary"></p>

<button class="btn btn-danger choice-btn" onclick="playGame('rock')">
👊🏼 
</button>

<button class="btn btn-primary choice-btn" onclick="playGame('paper')">
🖐🏼
</button>

<button class="btn btn-success choice-btn" onclick="playGame('scissors')">
✌🏼
</button>

</div>

<hr>


<button class="btn btn-dark btn-lg w-100 mt-5 py-3 fs-20" onclick="resetGame()">
Reset Game
</button>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
